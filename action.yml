name: skilldrift
description: >-
  導入済みClaude Code Skillsの上流ドリフトを検知し、GitHub Issueで通知する。
  リポジトリの skilldrift.lock(skilldrift initで生成)が比較の基準になる。
author: kpab

branding:
  icon: shield
  color: orange

inputs:
  dir:
    description: skilldrift.lock のあるディレクトリ(リポジトリルートからの相対)
    default: "."
  create-issue:
    description: ドリフト検知時にIssueを作成/更新するか
    default: "true"
  issue-repo:
    description: Issueを立てるリポジトリ(owner/name)
    default: ${{ github.repository }}
  token:
    description: "GitHub APIトークン(上流の取得とIssue作成に使う。Issue作成には issues: write 権限が必要)"
    default: ${{ github.token }}
  fail-on-drift:
    description: ドリフト検知時にステップを失敗させるか(Issue通知だけで足りるなら "false" のまま)
    default: "false"
  scan-risk:
    description: ドリフト検知時にSkillSpectorで新旧リスクを再評価し、Issueにスコア比較を載せるか
    default: "true"
  version:
    description: 使う skilldrift のバージョン(例 "v0.1.0")。既定はactionのref、refがバージョンでなければ最新release
    default: ""

outputs:
  drifted:
    description: ドリフトを検知したか("true" / "false")
    value: ${{ steps.check.outputs.drifted }}

runs:
  using: composite
  steps:
    # GitHub Releases のバイナリをDLして使う(goreleaserが命名した
    # skilldrift_<goos>_<goarch>.tar.gz を取得)。
    # バージョンは version 入力 > actionのref(vX.Y.Z形式のとき) > 最新release の順で決める。
    - id: download
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=$(uname -m)
        case "$arch" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "未対応のアーキテクチャ: $arch" >&2; exit 1 ;;
        esac

        ver="$INPUT_VERSION"
        if [ -z "$ver" ]; then
          case "$ACTION_REF" in
            v[0-9]*) ver="$ACTION_REF" ;;   # vX.Y.Z でピンされていればそのrelease
            *)       ver="latest" ;;         # main等ブランチ参照なら最新release
          esac
        fi

        asset="skilldrift_${os}_${arch}.tar.gz"
        if [ "$ver" = "latest" ]; then
          url="https://github.com/kpab/skilldrift/releases/latest/download/${asset}"
        else
          url="https://github.com/kpab/skilldrift/releases/download/${ver}/${asset}"
        fi

        echo "skilldrift ${ver} (${os}/${arch}) を取得: $url"
        if ! curl -fsSL "$url" -o "$RUNNER_TEMP/skilldrift.tar.gz"; then
          echo "release バイナリのDLに失敗した($url)。version入力かactionのrefを確認してください" >&2
          exit 1
        fi
        tar -xzf "$RUNNER_TEMP/skilldrift.tar.gz" -C "$RUNNER_TEMP" skilldrift
        chmod +x "$RUNNER_TEMP/skilldrift"

    # リスク再評価に使う外部スキャナー。scan-risk が false ならスキップし、
    # skilldrift 側も skillspector 不在を検知して自動でリスク評価を飛ばす。
    - if: inputs.scan-risk == 'true'
      uses: astral-sh/setup-uv@v5

    - if: inputs.scan-risk == 'true'
      shell: bash
      run: |
        uv tool install "git+https://github.com/NVIDIA/skillspector.git"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_CREATE_ISSUE: ${{ inputs.create-issue }}
        INPUT_ISSUE_REPO: ${{ inputs.issue-repo }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        INPUT_SCAN_RISK: ${{ inputs.scan-risk }}
      run: |
        args=(check -dir "$INPUT_DIR")
        if [ "$INPUT_CREATE_ISSUE" = "true" ]; then
          args+=(-issue -issue-repo "$INPUT_ISSUE_REPO")
        fi
        if [ "$INPUT_SCAN_RISK" != "true" ]; then
          args+=(-scan=false)
        fi

        set +e
        "$RUNNER_TEMP/skilldrift" "${args[@]}"
        code=$?
        set -e

        case "$code" in
          0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
          1) echo "drifted=true" >> "$GITHUB_OUTPUT"
             if [ "$INPUT_FAIL_ON_DRIFT" = "true" ]; then
               exit 1
             fi ;;
          *) exit "$code" ;;
        esac
